name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, validate webview, and run tests
        run: npm run validate

  # Extension Host e2e stays on Ubuntu/Windows only. macOS GitHub-hosted runners are
  # headless without a reliable non-interactive display for Electron/VS Code
  # (@vscode/test-electron); Linux uses xvfb-run, and Windows is reliable enough
  # without a virtual framebuffer. Adding macos-latest here would be flaky.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run Extension Host tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
